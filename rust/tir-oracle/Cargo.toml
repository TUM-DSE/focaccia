[package]
name = "focaccia-tir-oracle"
version = "0.1.0"
edition = "2024"

# Nix places this crate inside the pinned TIR workspace. No sibling checkout is
# used: the workspace and its Cargo.lock come from the flake input.
[dependencies]
tir = { path = "../crates/tir" }
frontend = { path = "../crates/frontend" }
specializer = { path = "../crates/specializer" }
backend = { path = "../crates/backend" }
inkwell = { version = "0.6.0", features = ["llvm18-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
num-bigint = "0.4"
num-traits = "0.2"
